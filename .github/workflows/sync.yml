name: Fork sync
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fork-sync
      cancel-in-progress: false
    steps:
      - name: Require workflow-authorized sync credential
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: test -n "$FORK_SYNC_TOKEN" || { echo 'FORK_SYNC_TOKEN is required' >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: false
          token: ${{ secrets.FORK_SYNC_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bash .github/scripts/sync.sh
        env:
          HAS_WORKFLOW_TOKEN: ${{ secrets.FORK_SYNC_TOKEN != '' }}
      - name: Reconcile GitHub releases
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: node .github/scripts/releases.mjs
      - name: Dispatch next pending npm release at its tag
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git fetch --no-tags origin '+refs/tags/*:refs/fork-tags/*'
          bash .github/scripts/pending.sh
  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
      id-token: write
