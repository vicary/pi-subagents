name: Scoped release
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scoped-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify all fork release refs
        run: bash .github/scripts/sync.sh verify
      - name: Reconcile scoped npm releases
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/scripts/publish.sh
